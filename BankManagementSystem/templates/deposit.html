{% extends "base.html" %}

{% block title %}Deposit Amount - Bank Management System{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Deposit Funds</h1>
  <p>Credit funds to an active customer account</p>
</div>

<div class="card form-card">
  <form method="POST" action="{{ url_for('deposit') }}">

    <div class="form-group">
      <label for="account_number">Account Number *</label>
      <input type="text" id="account_number" name="account_number" class="form-control" required placeholder="e.g. ACC000000001" value="{{ account_number or '' }}">
    </div>

    <div class="form-group">
      <label for="amount">Deposit Amount (Rs.) *</label>
      <input type="number" id="amount" name="amount" class="form-control" step="0.01" min="0.01" required placeholder="e.g. 500.00">
      <div class="form-text">Must be greater than 0.</div>
    </div>

    <div class="form-group">
      <label for="description">Transaction Note / Description</label>
      <input type="text" id="description" name="description" class="form-control" placeholder="e.g. Cash Deposit, Cheque, Salary">
    </div>

    <div class="btn-group">
      <button type="submit" class="btn btn-primary btn-block">Confirm Deposit</button>
      <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
